groups:
  - name: inventory
    rules:
      - alert: InventoryUnavailable
        expr: probe_success{job="readiness"} == 0 or up{job="readiness"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: API de inventario no disponible
      - alert: InventoryScrapeFailed
        expr: up{job="inventory"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: No se pueden recolectar métricas de la API
      - alert: InventoryErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Más del uno por ciento de respuestas son errores del servidor
      - alert: InventoryLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Latencia p95 superior a 500 milisegundos
