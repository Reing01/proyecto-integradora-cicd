services:
  prometheus:
    image: inventory-prometheus:3.5.0
    build:
      context: .
      dockerfile: monitoring/Dockerfile.prometheus
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=35d]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    mem_limit: 512m
  blackbox:
    image: inventory-blackbox:0.27.0
    build:
      context: .
      dockerfile: monitoring/Dockerfile.blackbox
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/config.yml]
    mem_limit: 64m
volumes:
  prometheus-data:
