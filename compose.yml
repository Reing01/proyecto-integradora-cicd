services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE requerido}
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN:?API_TOKEN requerido}
      APP_VERSION: ${APP_VERSION:-dev}
      DB_PATH: /data/inventory.sqlite
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    volumes:
      - inventory-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  inventory-data:
